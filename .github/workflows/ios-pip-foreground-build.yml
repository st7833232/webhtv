name: iOS PiP Foreground Build

on:
  push:
    branches:
      - ios-poc
    paths:
      - ".github/workflows/ios-pip-foreground-build.yml"

permissions:
  contents: write

concurrency:
  group: ios-pip-foreground-build
  cancel-in-progress: false

jobs:
  verify-and-commit:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout ios-poc
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded PiP fix
        shell: bash
        env:
          FIX_PATCH_BASE64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["RUNNER_TEMP"], "ios-pip-fix.patch").write_bytes(
              base64.b64decode(os.environ["FIX_PATCH_BASE64"])
          )
          PY
          git apply --index "$RUNNER_TEMP/ios-pip-fix.patch"

      - name: Run full Swift test suite
        run: swift test --package-path ios

      - name: Prepare CPython payload
        run: scripts/fetch_python_ios.sh

      - name: Build Simulator Debug app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/WebHTVApp/WebHTVApp.xcodeproj \
            -scheme WebHTVApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            EXPANDED_CODE_SIGN_IDENTITY=- \
            EXPANDED_CODE_SIGN_IDENTITY_NAME='Ad Hoc' \
            build

      - name: Commit verified fix to ios-poc
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ios-pip-foreground-build.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(ios): restore player after foreground PiP"
          git push origin HEAD:ios-poc

      - name: Verification summary
        run: |
          {
            echo '### iOS PiP foreground restoration'
            echo '- `swift test --package-path ios`: passed'
            echo '- Simulator Debug build: passed'
            echo '- Packaging/release/tag: not performed'
            echo '- Real-device PiP verification: pending'
          } >> "$GITHUB_STEP_SUMMARY"
