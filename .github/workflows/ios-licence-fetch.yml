name: iOS licence fetch

# IOS-POC-17I licence gaps. One-off: the development environment cannot reach
# code.videolan.org, gitlab.freedesktop.org, gmplib.org or ftp.gnu.org. The
# first pass (run 36087320182) printed the libbluray, libudfread and uchardet
# licence files and matched nettle 3.10. This second pass prints the licence
# headers the first one only counted: the libbluray sources that mention the
# Mozilla or GNU General Public licences and whether the build compiles them,
# one ordinary source of each project, and GMP 6.2.1 from ftp.gnu.org, since
# gmplib.org refused the runner. It runs on the push that changes this file and
# is removed once the results are recorded in third_party/mpv-ios/.

on:
  workflow_dispatch:
  push:
    branches:
      - ios-poc
    paths:
      - ".github/workflows/ios-licence-fetch.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Helpers
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/lib.sh" <<'EOF'
          licences="$GITHUB_WORKSPACE/third_party/mpv-ios/licenses"
          sources=('*.c' '*.h' '*.cc' '*.cpp' '*.hpp' '*.m')

          # emit LABEL FILE: blob id, SHA-256 and size, then the bytes gzip -9n
          # compressed and base64 encoded between markers.
          emit() {
            printf '=== FILE %s %s %s %s\n' "$1" "$(git hash-object --no-filters "$2")" \
              "$(sha256sum "$2" | cut -d' ' -f1)" "$(stat -c %s "$2")"
            gzip -9nc "$2" | base64 -w 76
            printf '=== END %s\n' "$1"
          }

          # header DIR FILE: the file's first 40 lines, where the licence notice is.
          header() {
            echo "--- header $1/$2"
            sed -n '1,40p' "$1/$2" || echo "(missing)"
          }

          # built DIR FILE: meson.build or CMakeLists.txt lines naming the file.
          built() {
            echo "--- build references to $2"
            git -C "$1" grep -n -F "$(basename "$2")" -- '*meson.build' '*CMakeLists.txt' || echo "(none)"
          }

          # count DIR PHRASE...: sources containing each phrase on one line.
          count() {
            local dir="$1" p n
            shift
            for p in "$@"; do
              n="$( { git -C "$dir" grep -l -I -F "$p" -- "${sources[@]}" || true; } | wc -l)"
              printf 'PHRASE %s "%s": %s sources\n' "$dir" "$p" "$n"
            done
          }

          # compare FILE OURS: FILE's blob id against the recorded licence copy.
          compare() {
            local up ours
            up="$(git hash-object --no-filters "$1")"
            ours="$(git hash-object --no-filters "$licences/$2")"
            if [ "$up" = "$ours" ]; then
              echo "SAME $2 = $1 ($up)"
            else
              echo "DIFF $2 ($ours) vs $1 ($up)"
              emit "$1" "$1"
              return 1
            fi
          }
          EOF

      - name: libbluray 1.4.0 licence headers
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/lib.sh"
          cd "$RUNNER_TEMP"
          git -c advice.detachedHead=false clone --recursive --depth 1 --branch 1.4.0 \
            https://code.videolan.org/videolan/libbluray.git libbluray
          git -C libbluray log -1 --format='libbluray HEAD %H %cI %s'
          { git -C libbluray grep -l -I -F -e 'Mozilla Public' -e 'GNU General Public License' \
              -- "${sources[@]}" || true; } > flagged.txt
          echo "--- sources mentioning the Mozilla or GNU General Public licences"
          cat flagged.txt
          while read -r f; do
            header libbluray "$f"
            built libbluray "$f"
          done < flagged.txt
          header libbluray src/libbluray/bluray.c
          header libbluray/contrib/libudfread src/udfread.c
          count libbluray "version 2.1 of the License" "any later version" "GNU Lesser General Public"
          count libbluray/contrib/libudfread "version 2.1 of the License" "any later version" \
            "GNU Lesser General Public"
          echo "--- meson options"
          grep -n -A2 -E "'(bdj_jar|embed_udfread|enable_devtools|enable_tools)'" libbluray/meson_options.txt || true

      - name: uchardet v0.0.8 licence headers
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/lib.sh"
          cd "$RUNNER_TEMP"
          git -c advice.detachedHead=false clone --recursive --depth 1 --branch v0.0.8 \
            https://gitlab.freedesktop.org/uchardet/uchardet uchardet
          git -C uchardet log -1 --format='uchardet HEAD %H %cI %s'
          header uchardet src/uchardet.cpp
          header uchardet build-mac/uchardet.cpp
          built uchardet build-mac/uchardet.cpp
          count uchardet "MPL 1.1/GPL 2.0/LGPL 2.1" "Version 2.1 or later" "Version 2 or later"

      - name: GMP 6.2.1 release tarball against the recorded copies
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/lib.sh"
          cd "$RUNNER_TEMP"
          curl -fsSL --connect-timeout 30 --max-time 300 --retry 2 \
            -o gmp-6.2.1.tar.xz https://ftp.gnu.org/gnu/gmp/gmp-6.2.1.tar.xz
          sha256sum gmp-6.2.1.tar.xz
          tar -xf gmp-6.2.1.tar.xz
          fail=0
          compare gmp-6.2.1/COPYING.LESSERv3 LICENSE.gmp || fail=1
          compare gmp-6.2.1/COPYING LICENSE.gmp.COPYING || fail=1
          compare gmp-6.2.1/COPYINGv2 LICENSE.gmp.COPYINGv2 || fail=1
          compare gmp-6.2.1/COPYINGv3 LICENSE.gmp.COPYINGv3 || fail=1
          exit "$fail"
