# TEMPORARY — IOS-POC-45 verification only. Lives on the throwaway branch ci/ios-poc-45-verify,
# which is deleted after the run; it is never merged into ios-poc.
name: IOS-POC-45 temporary verification

on:
  push:
    branches: [ci/ios-poc-45-verify]

permissions:
  contents: read

concurrency:
  group: ios-poc-45-verify
  cancel-in-progress: true

env:
  BASE: f6cd65dbcb459d85bf019c0704a134ee38ab3a26

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Base worktree
        run: git worktree add ../base "$BASE"

      - name: WebHTVCore tests (macOS host)
        continue-on-error: true
        run: |
          set -o pipefail
          swift test --package-path ios 2>&1 | tee core-tests.log | grep -E '✘|error:|Test run with' | tail -n 150

      - name: WebHTVCore tests (iOS Simulator), change and base
        continue-on-error: true
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys
          d=json.load(sys.stdin)["devices"]
          print(next(x["udid"] for k,v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "simulator $udid"
          (cd ios && xcodebuild -scheme WebHTVCore -destination "id=$udid" -derivedDataPath ../build/CoreSim test > ../core-sim-tests.log 2>&1) || true
          (cd ../base/ios && xcodebuild -scheme WebHTVCore -destination "id=$udid" -derivedDataPath ../../webhtv/build/CoreSimBase test > ../../webhtv/core-sim-tests-base.log 2>&1) || true
          for f in core-sim-tests.log core-sim-tests-base.log; do
            echo "== $f"
            grep -E '✘ Test .* failed|Test run with|TEST SUCCEEDED|TEST FAILED' "$f" | sed 's/ after [0-9.]* seconds.*//' | sort -u | tail -n 40
          done

      - name: Set up host Python for the native Python packages
        id: host-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prepare CPython payload (device and simulator)
        env:
          PYTHON_HOST: ${{ steps.host-python.outputs.python-path }}
        run: |
          scripts/fetch_python_ios.sh --sdk iphoneos --sdk iphonesimulator
          rm -rf ../base/third_party/python-ios && cp -R third_party/python-ios ../base/third_party/python-ios

      - name: Builds (Debug device, Debug simulator, Release device), change and base
        continue-on-error: true
        run: |
          build() { # name dir configuration sdk destination
            (cd "$2" && xcodebuild -project ios/WebHTVApp/WebHTVApp.xcodeproj -scheme WebHTVApp -configuration "$3" \
              -sdk "$4" -destination "$5" -derivedDataPath "$GITHUB_WORKSPACE/build/$1" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
              EXPANDED_CODE_SIGN_IDENTITY=- EXPANDED_CODE_SIGN_IDENTITY_NAME='Ad Hoc' build > "$GITHUB_WORKSPACE/$1.log" 2>&1)
            echo "== $1: $(grep -E '\*\* BUILD (SUCCEEDED|FAILED)' "$GITHUB_WORKSPACE/$1.log" | tail -n 1)"
            grep -n -E 'error:|: error|fatal error|Command .* failed|The following build commands failed' "$GITHUB_WORKSPACE/$1.log" | head -n 40
            sed -n '/The following build commands failed/,+12p' "$GITHUB_WORKSPACE/$1.log"
          }
          build debug-device . Debug iphoneos 'generic/platform=iOS'
          build debug-device-base ../base Debug iphoneos 'generic/platform=iOS'
          build debug-simulator . Debug iphonesimulator 'generic/platform=iOS Simulator'
          build release-device . Release iphoneos 'generic/platform=iOS'

      - name: Warnings in the changed files
        if: always()
        run: |
          grep -hE 'warning:' debug-device.log debug-simulator.log release-device.log core-tests.log 2>/dev/null \
            | grep -E 'OnlineSubtitle|Subtitle(Cat|Cues|Download|HTTP|SearchKeywords|SessionCache)|LightHTML|PlaybackEngine.swift|PlaybackMediaSelection.swift|MPVEngine.swift' \
            | sort -u | head -n 80 || true
          echo "== WebHTVApp.swift warnings, change vs base"
          for f in release-device.log debug-device-base.log; do
            echo "-- $f: $(grep -E 'WebHTVApp.swift:[0-9]+:[0-9]+: warning' "$f" 2>/dev/null | sed 's/:[0-9]*:[0-9]*:/:/' | sort -u | wc -l)"
          done
          grep -E 'WebHTVApp.swift:[0-9]+:[0-9]+: warning' release-device.log 2>/dev/null | sed 's#.*/##' | sort -u | head -n 40 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-poc-45-logs-2
          path: "*.log"
          retention-days: 3
