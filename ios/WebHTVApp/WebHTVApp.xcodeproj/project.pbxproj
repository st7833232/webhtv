			name = "Prepare Python";
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\n# The payload is fetched, not committed, so a fresh clone builds without a manual step.\n\"$SRCROOT/../../scripts/fetch_python_ios.sh\"\n# Upstream ships the module map at Python.framework/Headers/module.modulemap, but clang looks for\n# a framework's module map under Modules/. Without this, `import Python` fails to resolve.\n# Runs before Sources because module resolution happens at compile time.\nfor slice in \"$SRCROOT/../../third_party/python-ios/Python.xcframework\"/ios-*; do\n  headers=\"$slice/Python.framework/Headers/module.modulemap\"\n  [ -f \"$headers\" ] || continue\n  mkdir -p \"$slice/Python.framework/Modules\"\n# Upstream's map is a plain module, meant for -fmodule-map-file. A map living inside a\n# framework has to declare `framework module`, or clang looks for the umbrella header in the\n# wrong place and the module fails to build.\n  sed 's/^module Python {/framework module Python {/' \"$headers\" > \"$slice/Python.framework/Modules/module.modulemap\"\ndone\n";
		};
		7E10000000000000000000A5 /* Install Python */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputPaths = (
			);
			name = "Install Python";
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\n# install_python is upstream's own installer: it lays the standard library out at\n# $CODESIGNING_FOLDER_PATH/python and turns lib-dynload into the signed framework form iOS\n# needs. Its argument is relative to $PROJECT_DIR, which is what its own example passes, and\n# it has to run after resources are copied but before the frameworks are embedded and signed.\nREL=../../third_party/python-ios/Python.xcframework\n. \"$PROJECT_DIR/$REL/build/utils.sh\"\ninstall_python \"$REL\"\n# The app's own Python travels beside the standard library, not inside it: a folder named\n# Python would be the same directory as install_python's python on a case-insensitive\n# filesystem, and a folder reference cannot rename its destination.\nrsync -au --delete \"$PROJECT_DIR/Python/\" \"$CODESIGNING_FOLDER_PATH/webhtv-python/\"\n# The vendored pure-Python packages travel separately from our own two files, so what is\n# ours and what is third party stays obvious in the bundle as well as in the repository.\nrsync -au --delete \"$PROJECT_DIR/../../third_party/python-ios/site-packages/\" \"$CODESIGNING_FOLDER_PATH/python-packages/\"\n";
		};
/* End PBXShellScriptBuildPhase section */

