name: iOS FFmpeg Build

# IOS-POC-26-2b. Rebuilds FFmpeg n8.1.2 with the MPVKit 1.0.0 recipe and the
# WebHTV HLS patches (third_party/mpv-ios/patches/ffmpeg), which put packet
# timestamps on the playlist timeline across EXT-X-DISCONTINUITY, as the
# FongMi FFmpeg that WebHTV Android ships does. Only Libavformat changes; it is
# checked against the upstream 1.0.0 Libavformat and published as a prerelease.
# Every other FFmpeg library the app links stays the upstream 1.0.0 binary.
# Every input is pinned in the "ffmpeg" section of third_party/mpv-ios-lock.json.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the prerelease from this branch (W-262: test branches)"
        type: boolean
        default: false
  push:
    branches:
      - ios-poc
    paths:
      - ".github/workflows/ios-ffmpeg-build.yml"
      - "third_party/mpv-ios/patches/ffmpeg/**"
      - "third_party/mpv-ios/patches/buildscripts/0002-build-ffmpeg-only.patch"
      - "third_party/mpv-ios/patches/buildscripts/0003-enable-vvc-decoder.patch"

permissions:
  contents: write

concurrency:
  group: ios-ffmpeg-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json
          lock = json.load(open("third_party/mpv-ios-lock.json"))
          ff = lock["ffmpeg"]
          values = {
              "mpvkit_repo": lock["recipe"]["repo"],
              "mpvkit_commit": lock["recipe"]["build_commit"],
              "workdir": lock["recipe"]["workdir"],
              "xcode": lock["toolchain"]["xcode"],
              "python": lock["toolchain"]["python"],
              "meson": lock["toolchain"]["meson"],
              "ff_tag": ff["tag"],
              "ff_commit": ff["commit"],
              "ref_url": ff["reference"]["url"],
              "ref_sha256": ff["reference"]["sha256"],
              "repro_url": ff["reproducibility"]["url"],
              "repro_sha256": ff["reproducibility"]["sha256"],
              "ref_avcodec_url": ff["reference_avcodec"]["url"],
              "ref_avcodec_sha256": ff["reference_avcodec"]["sha256"],
              "tag": ff["artifact"]["release_tag"],
          }
          for key, value in values.items():
              print(f"{key}={value}")
          EOF
          mkdir -p "$RUNNER_TEMP/out"

      - name: Select Xcode
        env:
          XCODE: ${{ steps.lock.outputs.xcode }}
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
          clang --version | head -n 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.lock.outputs.python }}

      - name: Install pinned meson
        env:
          MESON: ${{ steps.lock.outputs.meson }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/meson"
          "$RUNNER_TEMP/meson/bin/python" -m pip install --disable-pip-version-check --quiet "meson==$MESON"
          ln -sf "$RUNNER_TEMP/meson/bin/meson" /opt/homebrew/bin/meson
          echo "meson $(meson --version)"

      - name: Fetch the MPVKit recipe
        env:
          REPO: ${{ steps.lock.outputs.mpvkit_repo }}
          COMMIT: ${{ steps.lock.outputs.mpvkit_commit }}
          WORKDIR: ${{ steps.lock.outputs.workdir }}
        run: |
          set -euo pipefail
          mkdir -p "$WORKDIR"
          git -C "$WORKDIR" init -q
          git -C "$WORKDIR" fetch -q --depth 1 "$REPO" "$COMMIT"
          git -C "$WORKDIR" checkout -q --detach FETCH_HEAD
          test "$(git -C "$WORKDIR" rev-parse HEAD)" = "$COMMIT"

      - name: Apply the WebHTV patches to the recipe
        env:
          WORKDIR: ${{ steps.lock.outputs.workdir }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import hashlib, json, os, sys
          ff = json.load(open("third_party/mpv-ios-lock.json"))["ffmpeg"]
          def sha(path):
              return hashlib.sha256(open(path, "rb").read()).hexdigest()
          patch_dir = ff["patches"]["dir"]
          names = sorted(n for n in os.listdir(patch_dir) if n.endswith(".patch"))
          if names != sorted(ff["patches"]["files"]):
              sys.exit(f"::error title=FFmpeg patches::expected {sorted(ff['patches']['files'])}, found {names}")
          for name in names:
              if sha(os.path.join(patch_dir, name)) != ff["patches"]["files"][name]:
                  sys.exit(f"::error title=FFmpeg patches::{name} does not match the lock")
          for key in ("buildscripts", "buildscripts_vvc"):
              if sha(ff[key]["path"]) != ff[key]["sha256"]:
                  sys.exit(f"::error title=Buildscripts patch::{ff[key]['path']} does not match the lock")
          # The recipe has no FFmpeg patches of its own; ours must be the only ones.
          upstream = os.path.join(os.environ["WORKDIR"], "Sources/BuildScripts/patch/FFmpeg")
          if os.path.exists(upstream):
              sys.exit(f"::error title=Recipe patches::the recipe now ships {upstream}; review it before building")
          EOF
          mkdir -p "$WORKDIR/Sources/BuildScripts/patch/FFmpeg"
          cp third_party/mpv-ios/patches/ffmpeg/*.patch "$WORKDIR/Sources/BuildScripts/patch/FFmpeg/"
          git -C "$WORKDIR" apply "$GITHUB_WORKSPACE/third_party/mpv-ios/patches/buildscripts/0002-build-ffmpeg-only.patch"
          # W-262: the recipe's decoder list plus vvc, for ByteVC2 ('bvc2') sources.
          git -C "$WORKDIR" apply "$GITHUB_WORKSPACE/third_party/mpv-ios/patches/buildscripts/0003-enable-vvc-decoder.patch"
          git -C "$WORKDIR" status --short

      - name: Place the pinned dependency zips
        env:
          WORKDIR: ${{ steps.lock.outputs.workdir }}
        run: |
          set -euo pipefail
          # FFmpeg is built from source here, so its zip is not placed: the
          # recipe would take an existing FFmpeg directory as already cloned.
          python3 - > "$RUNNER_TEMP/deps.tsv" <<'EOF'
          import json
          for dep in json.load(open("third_party/mpv-ios-lock.json"))["dependencies"]:
              if dep["name"] != "FFmpeg":
                  print("\t".join([dep["name"], dep["version"], dep["url"], dep["sha256"]]))
          EOF
          while IFS=$'\t' read -r name version url sha256; do
            dir="$WORKDIR/dist/$name-$version"
            mkdir -p "$dir"
            curl -fsSL --retry 5 --retry-delay 15 --retry-all-errors -o "$dir/$name.zip" "$url"
            echo "$sha256  $dir/$name.zip" | shasum -a 256 -c -
            unzip -q -o "$dir/$name.zip" -d "$dir"
          done < "$RUNNER_TEMP/deps.tsv"

      - name: Build FFmpeg
        working-directory: ${{ steps.lock.outputs.workdir }}
        env:
          TAG: ${{ steps.lock.outputs.tag }}
        run: |
          set -euo pipefail
          echo "nasm: $(command -v nasm || echo none) $(nasm -v 2>/dev/null || true)"
          make build platform=ios "version=$TAG" 2>&1 | tee "$RUNNER_TEMP/out/build.log"

      - name: Check what the build used
        env:
          WORKDIR: ${{ steps.lock.outputs.workdir }}
          FF_TAG: ${{ steps.lock.outputs.ff_tag }}
          FF_COMMIT: ${{ steps.lock.outputs.ff_commit }}
        run: |
          set -euo pipefail
          src="$WORKDIR/dist/FFmpeg-$FF_TAG"
          if [[ "$(git -C "$src" rev-parse HEAD)" != "$FF_COMMIT" ]]; then
            echo "::error title=FFmpeg source::$FF_TAG is not $FF_COMMIT"
            exit 1
          fi
          for f in libavformat/hls_timestamp.c libavformat/hls_timestamp.h; do
            test -f "$src/$f" || { echo "::error title=FFmpeg source::$f is missing: the WebHTV patches were not applied"; exit 1; }
          done
          grep -q ff_hls_timestamp_map "$src/libavformat/hls.c" || { echo "::error title=FFmpeg source::hls.c does not call the timestamp mapping"; exit 1; }
          grep -q "MKTAG('b', 'v', 'c', '2')" "$src/libavformat/isom_tags.c" || { echo "::error title=FFmpeg source::the bvc2 patch was not applied"; exit 1; }
          grep -q -- "--enable-decoder=vvc" "$WORKDIR/Sources/BuildScripts/XCFrameworkBuild/main.swift" || { echo "::error title=Recipe::vvc is not in the decoder list"; exit 1; }
          git -C "$src" status --short | tee "$RUNNER_TEMP/out/ffmpeg-source-status.txt"
          python3 - <<'EOF'
          import glob, hashlib, json, os, sys
          lock = json.load(open("third_party/mpv-ios-lock.json"))
          dist = os.path.join(os.environ["WORKDIR"], "dist")
          pinned = {f"{d['name']}-{d['version']}/{d['name']}.zip": d["sha256"] for d in lock["dependencies"] if d["name"] != "FFmpeg"}
          found = {os.path.relpath(p, dist) for p in glob.glob(os.path.join(dist, "*", "*.zip"))}
          found = {p for p in found if not p.startswith("release/")}
          if found != set(pinned):
              sys.exit(f"::error title=Dependencies::unpinned {sorted(found - set(pinned))}, missing {sorted(set(pinned) - found)}")
          for rel, want in pinned.items():
              if hashlib.sha256(open(os.path.join(dist, rel), "rb").read()).hexdigest() != want:
                  sys.exit(f"::error title=Dependencies::{rel} changed during the build")
          print(f"{len(found)} dependency zips, all pinned")
          EOF

      - name: Compare with the upstream FFmpeg libraries
        env:
          WORKDIR: ${{ steps.lock.outputs.workdir }}
          REF_URL: ${{ steps.lock.outputs.ref_url }}
          REF_SHA256: ${{ steps.lock.outputs.ref_sha256 }}
          REPRO_URL: ${{ steps.lock.outputs.repro_url }}
          REPRO_SHA256: ${{ steps.lock.outputs.repro_sha256 }}
          REF_AVCODEC_URL: ${{ steps.lock.outputs.ref_avcodec_url }}
          REF_AVCODEC_SHA256: ${{ steps.lock.outputs.ref_avcodec_sha256 }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/compare"
          mkdir -p "$work"
          report="$RUNNER_TEMP/out/compare.txt"
          : > "$report"
          fail=0
          check() { # name, reference text, new text
            if [[ "$2" == "$3" && -n "$2" ]]; then
              echo "same: $1" >> "$report"
            else
              echo "DIFFERENT: $1" >> "$report"
              diff <(printf '%s\n' "$2") <(printf '%s\n' "$3") >> "$report" || true
              echo "::error title=Compare::$1"
              fail=1
            fi
          }
          symbols() { # flags, archive or object; an empty list is not an error
            nm "$1" "$2" 2>/dev/null | { grep -v -e '^$' -e ':$' || true; } | sort -u
          }
          thin() { # universal or thin archive, output
            if lipo -info "$1" | grep -q '^Non-fat'; then cp "$1" "$2"; else lipo -thin arm64 "$1" -output "$2"; fi
          }
          unpack() { # name, url, sha256, dir
            curl -fsSL --retry 5 --retry-delay 15 --retry-all-errors -o "$work/$1.zip" "$2"
            echo "$3  $work/$1.zip" | shasum -a 256 -c -
            mkdir -p "$4"
            unzip -q "$work/$1.zip" -d "$4"
          }
          unpack ref-avformat "$REF_URL" "$REF_SHA256" "$work/ref"
          unpack ref-avutil "$REPRO_URL" "$REPRO_SHA256" "$work/ref"
          unpack ref-avcodec "$REF_AVCODEC_URL" "$REF_AVCODEC_SHA256" "$work/ref"
          # W-262: the one configure argument WebHTV adds; every configuration string
          # must equal upstream's once it is taken out.
          novvc() { sed 's/ --enable-decoder=vvc//'; }
          for lib in Libavformat Libavutil Libavcodec; do
            unzip -q "$WORKDIR/dist/release/$lib.xcframework.zip" -d "$work/new"
          done

          # 1. Reproducibility: Libavutil has no WebHTV change, so this build
          # must reproduce the upstream one in everything compared here.
          ref_fw="$work/ref/Libavutil.xcframework/ios-arm64/Libavutil.framework"
          new_fw="$work/new/Libavutil.xcframework/ios-arm64/Libavutil.framework"
          thin "$ref_fw/Libavutil" "$work/ref-avutil.a"
          thin "$new_fw/Libavutil" "$work/new-avutil.a"
          check "Libavutil configuration" "$(strings -a "$work/ref-avutil.a" | grep -F -- '--disable-armv5te' | sort -u)" \
                                          "$(strings -a "$work/new-avutil.a" | grep -F -- '--disable-armv5te' | novvc | sort -u)"
          check "Libavutil archive members" "$(ar t "$work/ref-avutil.a" | grep -v '^__.SYMDEF' | sort)" \
                                            "$(ar t "$work/new-avutil.a" | grep -v '^__.SYMDEF' | sort)"
          check "Libavutil defined external symbols" "$(symbols -gUj "$work/ref-avutil.a")" "$(symbols -gUj "$work/new-avutil.a")"
          check "Libavutil undefined symbols" "$(symbols -guj "$work/ref-avutil.a")" "$(symbols -guj "$work/new-avutil.a")"

          # 2. Libavformat: the upstream library plus exactly the WebHTV change.
          ref_fw="$work/ref/Libavformat.xcframework/ios-arm64/Libavformat.framework"
          new_fw="$work/new/Libavformat.xcframework/ios-arm64/Libavformat.framework"
          ref_lib="$work/ref-avformat.a"
          new_lib="$work/new-avformat.a"
          thin "$ref_fw/Libavformat" "$ref_lib"
          thin "$new_fw/Libavformat" "$new_lib"
          for text in "--disable-armv5te" "FFmpeg version"; do
            check "Libavformat strings containing $text" "$(strings -a "$ref_lib" | grep -F -- "$text" | sort -u)" \
                                                         "$(strings -a "$new_lib" | grep -F -- "$text" | novvc | sort -u)"
          done
          words() { tr '\n' ' ' | sed 's/ $//'; }
          members() { ar t "$1" | { grep -v '^__.SYMDEF' || true; } | sort; }
          added="$(comm -13 <(members "$ref_lib") <(members "$new_lib") | words)"
          removed="$(comm -23 <(members "$ref_lib") <(members "$new_lib") | words)"
          check "Libavformat archive members added" "hls_timestamp.o" "${added:-none}"
          check "Libavformat archive members removed" "none" "${removed:-none}"
          added="$(comm -13 <(symbols -gUj "$ref_lib") <(symbols -gUj "$new_lib") | words)"
          removed="$(comm -23 <(symbols -gUj "$ref_lib") <(symbols -gUj "$new_lib") | words)"
          check "Libavformat defined external symbols added" \
            "_ff_hls_timestamp_init _ff_hls_timestamp_map _ff_hls_timestamp_map_segment _ff_hls_timestamp_reached _ff_hls_timestamp_reset _ff_hls_timestamp_stream_init" \
            "${added:-none}"
          check "Libavformat defined external symbols removed" "none" "${removed:-none}"
          # Undefined symbols may differ only through hls.o and hls_timestamp.o,
          # plus one named SDK exception accepted by the user on 2026-09-26 after
          # run 36215262840: the Xcode 26.6 SDK's libxml2 headers turn dashdec.c's
          # xmlFree/xmlRealloc into the system free/realloc (the upstream build,
          # made with Xcode 15.4, calls libxml2's). Allowed only while dashdec.o
          # is the one user on each side and nothing else uses the four symbols.
          mkdir -p "$work/ref-members" "$work/new-members" "$work/ref-all" "$work/new-all"
          (cd "$work/ref-members" && ar -x "$ref_lib" hls.o)
          (cd "$work/new-members" && ar -x "$new_lib" hls.o hls_timestamp.o)
          (cd "$work/ref-all" && ar -x "$ref_lib")
          (cd "$work/new-all" && ar -x "$new_lib")
          users() { # side, symbol: the members referencing it, space-separated
            (cd "$work/$1-all" && for o in *.o; do if symbols -uj "$o" | grep -qx "$2"; then echo "$o"; fi; done) | tr '\n' ' ' | sed 's/ $//'
          }
          allowed="$( (symbols -uj "$work/ref-members/hls.o"; symbols -uj "$work/new-members/hls.o"; symbols -uj "$work/new-members/hls_timestamp.o") | sort -u)"
          sdk_allowed=""
          for pair in xmlFree:free xmlRealloc:realloc; do
            old="_${pair%%:*}"; new="_${pair##*:}"
            if [[ "$(users ref "$old")" == dashdec.o && -z "$(users new "$old")" \
                  && -z "$(users ref "$new")" && "$(users new "$new")" == dashdec.o ]]; then
              sdk_allowed="$sdk_allowed $old $new"
            fi
          done
          echo "SDK exception applied to: ${sdk_allowed:- none}" >> "$report"
          changed="$(comm -3 <(symbols -guj "$ref_lib") <(symbols -guj "$new_lib") | tr -d '\t' | sed '/^$/d' | sort -u)"
          outside="$(comm -23 <(printf '%s\n' "$changed" | sed '/^$/d') \
                              <(printf '%s\n' "$allowed" $sdk_allowed | sed '/^$/d' | sort -u))"
          check "Libavformat undefined symbols outside hls.o and hls_timestamp.o" "none" "${outside:-none}"
          check "Libavformat framework files other than the binary and config.h" \
            "$(cd "$ref_fw" && find . -type f ! -name Libavformat ! -name config.h -exec shasum -a 256 {} + | sort -k 2)" \
            "$(cd "$new_fw" && find . -type f ! -name Libavformat ! -name config.h -exec shasum -a 256 {} + | sort -k 2)"
          # config.h records the build machine. Named toolchain exception accepted
          # by the user on 2026-09-26 (run 36215262840): only the compiler
          # identifier and three assembler/SDK probes may differ, and only to the
          # values Xcode 26.6 gives. None of the three probes reaches libavformat.
          toolchain_lines='^#define (CC_IDENT|HAVE_AS_ARCHEXT_DOTPROD_DIRECTIVE|HAVE_AS_ARCHEXT_I8MM_DIRECTIVE|HAVE_KVTQPMODULATIONLEVEL_DEFAULT) '
          # W-262: enabling vvc changes the recorded configuration and turns on vvc_sei;
          # config.h is shared by every library, so the same two lines move everywhere.
          vvc_lines='^#define (FFMPEG_CONFIGURATION|CONFIG_VVC_SEI) '
          check "Libavformat config.h outside the toolchain and vvc lines" \
            "$(grep -Ev "$toolchain_lines" "$ref_fw/Headers/config.h" | grep -Ev "$vvc_lines" | shasum -a 256)" \
            "$(grep -Ev "$toolchain_lines" "$new_fw/Headers/config.h" | grep -Ev "$vvc_lines" | shasum -a 256)"
          check "Libavformat config.h vvc lines" \
            "$(grep -E "$vvc_lines" "$ref_fw/Headers/config.h" | sed 's/CONFIG_VVC_SEI 0/CONFIG_VVC_SEI 1/')" \
            "$(grep -E "$vvc_lines" "$new_fw/Headers/config.h" | novvc)"
          check "Libavformat config.h toolchain lines" \
            "$(printf '%s\n' '#define CC_IDENT "Apple clang version 21.0.0 (clang-2100.1.1.101)"' \
                              '#define HAVE_AS_ARCHEXT_DOTPROD_DIRECTIVE 1' \
                              '#define HAVE_AS_ARCHEXT_I8MM_DIRECTIVE 1' \
                              '#define HAVE_KVTQPMODULATIONLEVEL_DEFAULT 1')" \
            "$(grep -E "$toolchain_lines" "$new_fw/Headers/config.h")"
          check "Libavformat simulator architectures" \
            "$(lipo -archs "$work/ref/Libavformat.xcframework/ios-arm64_x86_64-simulator/Libavformat.framework/Libavformat")" \
            "$(lipo -archs "$work/new/Libavformat.xcframework/ios-arm64_x86_64-simulator/Libavformat.framework/Libavformat")"
          {
            echo "Libavformat undefined symbols that differ from upstream: ${changed:-none}"
            echo "Libavformat members, upstream: $(ar t "$ref_lib" | grep -vc '^__.SYMDEF'); new: $(ar t "$new_lib" | grep -vc '^__.SYMDEF')"
          } >> "$report"
          # Name the members behind every undefined symbol that differs, on both sides.
          for sym in $changed; do
            for side in ref new; do
              who="$(users "$side" "$sym")"
              echo "$sym, $side users: ${who:-none}" >> "$report"
            done
          done
          echo "config.h, upstream against new:" >> "$report"
          diff "$ref_fw/Headers/config.h" "$new_fw/Headers/config.h" >> "$report" || true

          # 3. Libavcodec (W-262): the upstream library plus the vvc decoder and nothing else.
          ref_fw="$work/ref/Libavcodec.xcframework/ios-arm64/Libavcodec.framework"
          new_fw="$work/new/Libavcodec.xcframework/ios-arm64/Libavcodec.framework"
          ref_lib="$work/ref-avcodec.a"
          new_lib="$work/new-avcodec.a"
          thin "$ref_fw/Libavcodec" "$ref_lib"
          thin "$new_fw/Libavcodec" "$new_lib"
          check "Libavcodec configuration" "$(strings -a "$ref_lib" | grep -F -- '--disable-armv5te' | sort -u)" \
                                           "$(strings -a "$new_lib" | grep -F -- '--disable-armv5te' | novvc | sort -u)"
          removed="$(comm -23 <(members "$ref_lib") <(members "$new_lib") | words)"
          check "Libavcodec archive members removed" "none" "${removed:-none}"
          removed="$(comm -23 <(symbols -gUj "$ref_lib") <(symbols -gUj "$new_lib") | words)"
          check "Libavcodec defined external symbols removed" "none" "${removed:-none}"
          added="$(comm -13 <(symbols -gUj "$ref_lib") <(symbols -gUj "$new_lib"))"
          check "Libavcodec has the vvc decoder" "_ff_vvc_decoder" "$(printf '%s\n' "$added" | grep -x _ff_vvc_decoder || true)"
          # The VVC adaptive loop filter's NEON code (aarch64/vvc/alf.S) is named ff_alf_*.
          other="$(printf '%s\n' "$added" | sed '/^$/d' | grep -Eiv 'vvc|h266|executor|^_ff_alf_' | words)"
          check "Libavcodec defined external symbols added outside vvc" "none" "${other:-none}"
          check "Libavcodec framework files other than the binary and the generated config" \
            "$(cd "$ref_fw" && find . -type f ! -name Libavcodec ! -name config.h ! -name config_components.h -exec shasum -a 256 {} + | sort -k 2)" \
            "$(cd "$new_fw" && find . -type f ! -name Libavcodec ! -name config.h ! -name config_components.h -exec shasum -a 256 {} + | sort -k 2)"
          if [[ -f "$ref_fw/Headers/config_components.h" ]]; then
            check "Libavcodec config_components.h outside CONFIG_VVC_DECODER" \
              "$(grep -v '^#define CONFIG_VVC_DECODER ' "$ref_fw/Headers/config_components.h" | shasum -a 256)" \
              "$(grep -v '^#define CONFIG_VVC_DECODER ' "$new_fw/Headers/config_components.h" | shasum -a 256)"
            check "Libavcodec CONFIG_VVC_DECODER" "#define CONFIG_VVC_DECODER 1" \
              "$(grep '^#define CONFIG_VVC_DECODER ' "$new_fw/Headers/config_components.h")"
          fi
          # Only Libavcodec and Libavformat are replaced; the app keeps the upstream Libavutil, so every
          # av_/ff_ symbol the new decoder needs from outside Libavcodec must be defined there.
          external="$(comm -13 <(symbols -guj "$ref_lib") <(symbols -guj "$new_lib") \
                      | comm -23 - <(symbols -gUj "$new_lib") | grep -E '^_(av|ff|avpriv)_' || true)"
          missing="$(printf '%s\n' "$external" | sed '/^$/d' | comm -23 - <(symbols -gUj "$work/ref-avutil.a") | words)"
          check "Libavcodec new av_/ff_ symbols not defined in the upstream Libavutil" "none" "${missing:-none}"
          check "Libavcodec simulator architectures" \
            "$(lipo -archs "$work/ref/Libavcodec.xcframework/ios-arm64_x86_64-simulator/Libavcodec.framework/Libavcodec")" \
            "$(lipo -archs "$work/new/Libavcodec.xcframework/ios-arm64_x86_64-simulator/Libavcodec.framework/Libavcodec")"
          {
            echo "Libavcodec members added: $(comm -13 <(members "$ref_lib") <(members "$new_lib") | words)"
            echo "Libavcodec defined external symbols added: $(printf '%s\n' "$added" | sed '/^$/d' | wc -l | tr -d ' ')"
            echo "Libavcodec undefined symbols, upstream only: $(comm -23 <(symbols -guj "$ref_lib") <(symbols -guj "$new_lib") | words)"
            echo "Libavcodec undefined symbols, new only: $(comm -13 <(symbols -guj "$ref_lib") <(symbols -guj "$new_lib") | words)"
            echo "Libavcodec ios-arm64 bytes, upstream: $(stat -f %z "$ref_lib"); new: $(stat -f %z "$new_lib")"
            echo "Libavcodec zip bytes, upstream: $(stat -f %z "$work/ref-avcodec.zip"); new: $(stat -f %z "$WORKDIR/dist/release/Libavcodec.xcframework.zip")"
          } >> "$report"
          mkdir -p "$RUNNER_TEMP/out/new-libs"
          cp "$WORKDIR/dist/release/Libavformat.xcframework.zip" "$WORKDIR/dist/release/Libavutil.xcframework.zip" \
             "$WORKDIR/dist/release/Libavcodec.xcframework.zip" "$RUNNER_TEMP/out/new-libs/"
          cat "$report"
          exit "$fail"

      - name: Write the build manifest
        env:
          WORKDIR: ${{ steps.lock.outputs.workdir }}
          TAG: ${{ steps.lock.outputs.tag }}
          FF_TAG: ${{ steps.lock.outputs.ff_tag }}
        run: |
          set -euo pipefail
          release="$WORKDIR/dist/release"
          : > "$RUNNER_TEMP/artifacts.txt"
          for lib in Libavformat Libavcodec; do
            zip="$release/$lib.xcframework.zip"
            sha256="$(shasum -a 256 "$zip" | cut -d ' ' -f 1)"
            checksum="$(tr -d '[:space:]' < "$release/$lib.xcframework.checksum.txt")"
            if [[ "$sha256" != "$checksum" ]]; then
              echo "::error title=Checksum::$lib SwiftPM checksum $checksum is not the zip's sha256 $sha256"
              exit 1
            fi
            cp "$zip" "$RUNNER_TEMP/out/$lib.xcframework.zip"
            {
              echo "artifact: $lib.xcframework.zip"
              echo "bytes: $(stat -f %z "$zip")"
              echo "sha256 (SwiftPM checksum): $sha256"
            } >> "$RUNNER_TEMP/artifacts.txt"
          done
          {
            cat "$RUNNER_TEMP/artifacts.txt"
            echo "release tag: $TAG"
            echo "source: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "nasm: $(nasm -v 2>/dev/null || echo none)"
            echo "recipe: $(git -C "$WORKDIR" rev-parse HEAD)"
            echo "ffmpeg: $(git -C "$WORKDIR/dist/FFmpeg-$FF_TAG" rev-parse HEAD)"
            echo "ffmpeg patches:"
            (cd "$WORKDIR/Sources/BuildScripts/patch/FFmpeg" && shasum -a 256 *.patch)
            shasum -a 256 third_party/mpv-ios/patches/buildscripts/0002-build-ffmpeg-only.patch
            shasum -a 256 third_party/mpv-ios/patches/buildscripts/0003-enable-vvc-decoder.patch
            echo "dependency zips:"
            (cd "$WORKDIR/dist" && shasum -a 256 */*.zip | grep -v ' release/')
          } > "$RUNNER_TEMP/out/build-manifest.txt"
          cat "$RUNNER_TEMP/out/build-manifest.txt"
          {
            echo "### Libavformat and Libavcodec ($TAG)"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/artifacts.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/out
            ${{ steps.lock.outputs.workdir }}/dist/*.log
          if-no-files-found: warn

      - name: Publish the prerelease
        if: github.ref == 'refs/heads/ios-poc' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.lock.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # W-262: a tag a manual run already published from a test branch is not published again
            # when the reviewed commit lands on ios-poc; that push only rebuilds and compares.
            if [[ "${{ github.event_name }}" == push ]]; then
              echo "::notice title=Release exists::$TAG is already published ($(gh release view "$TAG" --json targetCommitish -q .targetCommitish)); this run verified the build only"
              exit 0
            fi
            echo "::error title=Release exists::$TAG is already published; bump ffmpeg.artifact.release_tag in third_party/mpv-ios-lock.json to publish a new build"
            exit 1
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Libavformat and Libavcodec xcframeworks for the WebHTV iOS app (IOS-POC-26-2b, W-262), not an app release.

          FFmpeg n8.1.2 built by this workflow with the MPVKit 1.0.0 recipe (LGPL product) and the patches in third_party/mpv-ios/patches/ffmpeg: upstream caa3fa6af070c1eeee59da027fdcde326fc64a89 and e27ad5760c0c8eca7c95bb907dc6e4e62dbf129b with their test commits, FongMi/FFmpeg 5805f9364c2e9a5f6ce625c9077b308c3ed4014d, and a WebHTV adaptation. HLS packet timestamps follow the playlist timeline across EXT-X-DISCONTINUITY. W-262: the MPVKit decoder list plus vvc (third_party/mpv-ios/patches/buildscripts/0003), and the mov demuxer reads ByteVC2 ('bvc2') as VVC (patch 0007, WebHTV's own, no librempeg code). Every other FFmpeg library the app links is the upstream 1.0.0 binary. Provenance: third_party/mpv-ios-lock.json and build-manifest.txt; the modified FFmpeg source is n8.1.2 plus those patches.
          EOF
          gh release create "$TAG" \
            "$RUNNER_TEMP/out/Libavformat.xcframework.zip" \
            "$RUNNER_TEMP/out/Libavcodec.xcframework.zip" \
            "$RUNNER_TEMP/out/build-manifest.txt" \
            "$RUNNER_TEMP/out/compare.txt" \
            "$RUNNER_TEMP/out/build.log" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "Libavformat and Libavcodec for WebHTV ($TAG)" \
            --notes-file "$RUNNER_TEMP/notes.md"
