# TEMPORARY — IOS-POC-48 verification only. Lives on the throwaway branch ci/ios-poc-48-verify;
# it is never merged into ios-poc.
name: IOS-POC-48 temporary verification

on:
  push:
    branches: [ci/ios-poc-48-verify]

permissions:
  contents: read

concurrency:
  group: ios-poc-48-verify
  cancel-in-progress: true

env:
  BASE: 7573e784b8c43f2995cc4d6536798775b67ee72d

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Base worktree
        run: git worktree add ../base "$BASE"

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: WebHTVCore tests, this change and base (macOS host)
        continue-on-error: true
        run: |
          swift test --package-path ios > core-tests.log 2>&1 || true
          (cd ../base && swift test --package-path ios > "$GITHUB_WORKSPACE/core-tests-base.log" 2>&1) || true
          for f in core-tests.log core-tests-base.log; do
            echo "== $f"
            grep -E 'error:|Test run with' "$f" | tail -n 20
            grep -E '✘ Test .* failed' "$f" | sed -E 's/ (after|with) .*//' | sort -u > "$f.failed"
            wc -l < "$f.failed"
          done
          echo "== failing here but not on base"
          comm -23 core-tests.log.failed core-tests-base.log.failed
          echo "== favourites suites"
          grep -E '(Favorite|ImportedConfig|ContractFreeze|theLibrary|deletingWatchHistory|playNow|twoQuickToggles)' core-tests.log | grep -E '✔|✘' | sed -E 's/ after .*//' | sort -u | tail -n 150

      - name: Set up host Python for the native Python packages
        id: host-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prepare CPython payload (device)
        env:
          PYTHON_HOST: ${{ steps.host-python.outputs.python-path }}
        run: scripts/fetch_python_ios.sh --sdk iphoneos

      - name: Builds (Debug device, Release device)
        continue-on-error: true
        run: |
          build() { # name configuration
            xcodebuild -project ios/WebHTVApp/WebHTVApp.xcodeproj -scheme WebHTVApp -configuration "$2" \
              -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$GITHUB_WORKSPACE/build/$1" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
              EXPANDED_CODE_SIGN_IDENTITY=- EXPANDED_CODE_SIGN_IDENTITY_NAME='Ad Hoc' build > "$GITHUB_WORKSPACE/$1.log" 2>&1 || true
            echo "== $1: $(grep -E '\*\* BUILD (SUCCEEDED|FAILED)' "$GITHUB_WORKSPACE/$1.log" | tail -n 1)"
            grep -n -E 'error:|: error|fatal error' "$GITHUB_WORKSPACE/$1.log" | sort -u | head -n 60 || true
            sed -n '/The following build commands failed/,+12p' "$GITHUB_WORKSPACE/$1.log" || true
          }
          build debug-device Debug
          build release-device Release

      - name: Warnings in the changed files
        if: always()
        run: |
          grep -hE 'warning:' debug-device.log release-device.log core-tests.log 2>/dev/null \
            | grep -E 'Favorites/|ConfigSource.swift|WebHTVApp.swift|ContractFreezeTests' | sed 's#.*/ios/#ios/#' | sort -u | head -n 80 || true

      - name: WebHTVCore tests, this change and base (iOS Simulator)
        continue-on-error: true
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys
          d=json.load(sys.stdin)["devices"]
          print(next(x["udid"] for k,v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "simulator $udid"
          (cd ../base/ios && xcodebuild -scheme WebHTVCore -destination "id=$udid" -derivedDataPath ../../webhtv/build/CoreSimBase test > ../../webhtv/core-sim-tests-base.log 2>&1) || true
          (cd ios && xcodebuild -scheme WebHTVCore -destination "id=$udid" -derivedDataPath ../build/CoreSim test > ../core-sim-tests.log 2>&1) || true
          for f in core-sim-tests-base.log core-sim-tests.log; do
            echo "== $f"
            grep -E 'Test run with|TEST SUCCEEDED|TEST FAILED' "$f" | tail -n 5
            grep -E '✘ Test .* failed' "$f" | sed -E 's/ (after|with) .*//' | sort -u > "$f.failed"
            wc -l < "$f.failed"
          done
          echo "== failing on the simulator here but not on base"
          comm -23 core-sim-tests.log.failed core-sim-tests-base.log.failed
          echo "== favourites on the simulator"
          grep -E '(Favorite|ImportedConfig|ContractFreeze)' core-sim-tests.log | grep -E '✘' | sed -E 's/ after .*//' | sort -u | head -n 40 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-poc-48-logs
          path: "*.log*"
          retention-days: 3
